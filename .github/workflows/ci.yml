name: Workspace Bench CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Run tests
        run: uv run --extra dev pytest

      - name: Validate benchmark scenarios
        run: |
          uv run --extra dev workspace-bench validate --collection core --min-scenarios 300
          uv run --extra dev workspace-bench validate --collection build-openbb-apps --min-scenarios 212

      - name: Run oracle baseline
        run: uv run --extra dev workspace-bench run --agent oracle

      - name: Export agent task envelope
        run: uv run --extra dev workspace-bench export-task --scenario gen_t0_create_price_performance_aapl --output /tmp/workspace-task.json

      - name: Run demo external agent
        run: uv run --extra dev workspace-bench run-agent-command --scenario gen_t0_create_price_performance_aapl --agent-command "python -m workspace_bench.examples.jsonl_rule_agent"

      - name: Build manifest
        run: uv run --extra dev workspace-bench manifest --json

      - name: Build report
        run: uv run --extra dev workspace-bench report --json

      - name: Smoke model comparison config
        run: uv run --extra dev workspace-bench compare-models --models-file examples/models.example.json --difficulty easy --dry-run

      - name: Build package
        run: uv build
