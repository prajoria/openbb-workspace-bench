name: Workspace Bench CI

# Expected on a GitHub-hosted Ubuntu runner: roughly 3–5 minutes, including
# Chromium installation and the 12 real-code backend certifications.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Lint
        run: uv run --extra dev ruff check src tests scripts

      - name: Type-check
        run: uv run --extra dev mypy src scripts

      - name: Run tests with coverage
        run: uv run --extra dev pytest --cov=workspace_bench --cov-report=term --cov-fail-under=65

      - name: Audit task identities and prompt openness
        run: |
          uv run python scripts/audits/audit_task_identity.py
          uv run python scripts/audits/report_prompt_stats.py
          uv run python scripts/audits/audit_release_consistency.py

      - name: Validate the usage suite
        run: uv run --extra dev workspace-bench validate --suite enterprise-apps-usage --min-tasks 192

      - name: Validate the build-openbb-apps suite
        run: uv run --extra dev workspace-bench validate --suite build-openbb-apps --min-tasks 236
      - name: Validate enterprise-apps-default suite
        run: uv run --extra dev workspace-bench validate --suite enterprise-apps-default --min-tasks 138

      - name: Validate the smoke suite
        run: uv run --extra dev workspace-bench validate --suite smoke --min-tasks 80

      - name: Run oracle baseline (usage)
        run: uv run --extra dev workspace-bench run --suite enterprise-apps-usage --agent oracle

      - name: Run oracle baseline (build-openbb-apps)
        run: uv run --extra dev workspace-bench run --suite build-openbb-apps --agent oracle

      - name: Probe runtime endpoints
        run: |
          uv run workspace-bench runtime-probe --suite build-openbb-apps

      - name: Reject adversarial candidates
        run: |
          uv run workspace-bench adversarial --suite enterprise-apps-usage
          uv run workspace-bench adversarial --suite build-openbb-apps

      - name: Install Chromium
        run: uv run --extra browser playwright install chromium

      - name: Certify the browser harness
        run: |
          uv run --extra browser workspace-bench browser-cert --dry-run
          uv run --extra browser workspace-bench browser-cert --self-test

      - name: Export agent task envelope
        run: uv run --extra dev workspace-bench export-task --task enterprise-apps-usage/curate/decision_briefing_level0 --output /tmp/workspace-task.json

      - name: Run demo external agent
        run: uv run --extra dev workspace-bench run-agent-command --task enterprise-apps-usage/curate/decision_briefing_level0 --agent-command "python -m workspace_bench.agents.rule_agent"

      - name: Build manifests
        run: |
          uv run --extra dev workspace-bench manifest --suite enterprise-apps-usage --json > /dev/null
          uv run --extra dev workspace-bench manifest --suite build-openbb-apps --json > /dev/null

      - name: Build release reports
        run: |
          uv run --extra dev workspace-bench report --suite enterprise-apps-usage --json > /dev/null
          uv run --extra dev workspace-bench report --suite build-openbb-apps --json > /dev/null

      - name: Smoke the evaluator dispatch
        run: |
          printf '{"models": [{"slug": "rule", "label": "Rule agent", "provider": "command", "model": "rule-agent", "command": "python -m workspace_bench.agents.rule_agent"}]}' > /tmp/models.json
          uv run --extra dev workspace-bench --models-file /tmp/models.json --task decision_briefing_level0 --runner batch --dry-run

      - name: Build package
        run: uv build

      - name: Verify lockfile
        run: uv lock --check
