[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbb-workspace-bench"
version = "0.1.0"
description = "Deterministic benchmark harness for OpenBB Workspace MCP agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenBB Workspace Bench contributors" }
]
keywords = ["agents", "benchmark", "finance", "mcp", "openbb", "workspace"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.urls]
Repository = "https://github.com/DidierRLopes/openbb-workspace-bench"
Issues = "https://github.com/DidierRLopes/openbb-workspace-bench/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
live = [
  "httpx>=0.28",
  "mcp>=1.27.0",
  "websockets>=16.0"
]
gym = [
  "gymnasium>=0.29"
]

[project.scripts]
workspace-bench = "workspace_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"workspace_bench.core" = ["scenarios/*.json"]
"workspace_bench.core.scenario_packs.stark_enterprise_v0" = ["*.json"]
"workspace_bench.workspace.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
