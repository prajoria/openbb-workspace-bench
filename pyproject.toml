[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbb-workspace-bench"
version = "0.1.0"
description = "Deterministic benchmark harness for OpenBB Workspace MCP agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenBB Workspace Bench contributors" }
]
keywords = ["agents", "benchmark", "finance", "mcp", "openbb", "workspace"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.urls]
Repository = "https://github.com/DidierRLopes/openbb-workspace-bench"
Issues = "https://github.com/DidierRLopes/openbb-workspace-bench/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10"
]
live = [
  "httpx>=0.28",
  "mcp>=1.27.0",
  "websockets>=16.0"
]
browser = [
  "playwright>=1.48"
]
codetrack = [
  "fastapi==0.138.0",
  "httpx>=0.28",
  "pytest==9.0.3",
  "uvicorn==0.49.0"
]

[project.scripts]
workspace-bench = "workspace_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"workspace_bench.core" = ["*.json"]
"workspace_bench.core.task_suites.core" = ["*.json", "**/*.json"]
"workspace_bench.core.task_suites.build_openbb_apps" = ["*.json", "**/*.json"]
"workspace_bench.core.task_suites.build_openbb_backends" = [
  "*.json", "**/*.json", "**/*.py", "**/*.toml", "**/*.md"
]
"workspace_bench.workspace.data" = ["*.json"]
"workspace_bench.browser" = ["*.json", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "browser: runs a real Playwright browser against the local certification harness"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.uv]
constraint-dependencies = [
  "pytest<=9.0.3",
  "sse-starlette<=3.4.4",
  "starlette<=1.2.1",
  "uvicorn<=0.49.0"
]
conflicts = [
  [
    { extra = "codetrack" },
    { extra = "live" }
  ]
]
